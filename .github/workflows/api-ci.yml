name: FastAPI CI
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/contracts/**'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-deploy.yml'
      - 'infra/api/**'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/contracts/**'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-deploy.yml'
      - 'infra/api/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/contracts/package-lock.json
      - name: Install locked web and contract dependencies
        run: |
          npm ci --ignore-scripts --prefix packages/contracts
          npm ci --ignore-scripts --prefix apps/web
      - name: Check web types and every native frontend suite
        run: |
          npm run typecheck --prefix apps/web
          npm test --prefix apps/web
  postgres-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.13-slim
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: demandrift-ci-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned API test dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Test actual PostgreSQL isolation and migrations
        env:
          PYTHONPATH: apps/api
          DEMANDRIFT_DB_TESTS: '1'
          DEMANDRIFT_TEST_ADMIN_URL: postgresql+psycopg://postgres:demandrift-ci-only@postgres:5432/postgres
          DEMANDRIFT_TEST_REDIS_URL: redis://redis:6379/0
        run: |
          python -m pytest -q -m postgres apps/api/tests
          python -m pytest -q -m postgres --junitxml=/tmp/worker-native.xml apps/api/tests/test_job_delivery.py apps/api/tests/test_job_worker.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('/tmp/worker-native.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 13
          assert sum(int(s.attrib.get(k, 0)) for s in suites for k in ('skipped', 'errors', 'failures')) == 0
          PY
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --target test --tag demandrift-api:test apps/api
      - name: Test infrastructure release boundaries without network access
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL
          --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128
          --volume "$PWD/infra/api:/repo/infra/api:ro"
          demandrift-api:test python -m pytest -q /repo/infra/api/tests
      - name: Run tests without network access
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128 demandrift-api:test
      - name: Reject generated contract drift
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128
          --volume "$PWD/apps/api:/repo/apps/api:ro"
          --volume "$PWD/packages/contracts:/repo/packages/contracts:ro"
          demandrift-api:test python /repo/apps/api/scripts/generate_contracts.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Check generated TypeScript consumers
        run: |
          npm ci --ignore-scripts --prefix packages/contracts
          npm run typecheck --prefix packages/contracts
      - name: Build runtime image
        run: docker build --target runtime --build-arg APP_REVISION="$GITHUB_SHA" --tag demandrift-api:ci apps/api
      - name: Verify runtime as non-root with deployment restrictions
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect demandrift-api:ci --format '{{.Config.User}}')" = '10001:10001'
          docker run -d --name demandrift-api-ci --read-only --cap-drop ALL --security-opt no-new-privileges --publish 127.0.0.1:18000:8000 demandrift-api:ci
          trap 'docker logs demandrift-api-ci; docker rm -f demandrift-api-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health > /tmp/api-health.json; then
              python3 -c 'import json, os; assert json.load(open("/tmp/api-health.json")) == {"status": "ok", "service": "demandrift-api", "revision": os.environ["GITHUB_SHA"]}'
              exit 0
            fi
            sleep 1
          done
          exit 1
